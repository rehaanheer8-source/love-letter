<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
  <div class="envelope" id="envelope">
    <div class="back"></div>

    <div class="letter">
      <p>
        3 saal pehle hum sirf ek kahani the,<br>
        aaj tum meri aadat, meri sukoon, meri duniya ho.<br><br>

        Har ups & downs me tumne mera haath nahi chhoda,<br>
        aur aaj main poochna chahta hoon—<br><br>

        <b>kya tum zindagi bhar mera saath dogi?</b><br><br>

        <span>Will you be mine forever? ❤️</span>
      </p>
    </div>

    <div class="front"></div>
    <div class="top"></div>
  </div>

  <div class="btns">
    <button onclick="openEnv()">OPEN</button>
    <button onclick="closeEnv()">CLOSE</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
