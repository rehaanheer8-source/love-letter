<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Letter</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: #ffe6ea;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

/* Envelope */
.envelope {
  width: 220px;
  height: 140px;
  background: pink;
  position: relative;
  cursor: pointer;
  border-radius: 6px;
  overflow: hidden;
}

/* Top flap */
.flap {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #ff4d6d;
  clip-path: polygon(0 0, 50% 50%, 100% 0);
  top: 0;
  left: 0;
  transform-origin: top;
  transition: 0.6s;
}

/* Letter */
.letter {
  position: absolute;
  width: 90%;
  height: 180px;
  background: white;
  left: 5%;
  bottom: -150px;
  padding: 12px;
  text-align: center;
  border-radius: 5px;
  transition: 0.8s;
  font-size: 13px;
}

/* Open animation */
.open .flap {
  transform: rotateX(180deg);
}

.open .letter {
  bottom: 10px;
}
</style>
</head>

<body>

<div class="envelope" onclick="openLetter()">
  <div class="flap"></div>

  <div class="letter">
    3 saal pehle hum sirf ek kahani the,<br>
    aaj tum meri aadat, meri sukoon, meri duniya ho.<br><br>

    Har ups & downs me tumne mera haath nahi chhoda,<br>
    aur aaj main poochna chahta hoon—<br><br>

    <b>kya tum zindagi bhar mera saath dogi?</b><br><br>

    <span style="color:red;">
      Will you be mine forever? ❤️
    </span>
  </div>
</div>

<script>
function openLetter() {
  document.querySelector(".envelope").classList.toggle("open");
}
</script>

</body>
</html>
