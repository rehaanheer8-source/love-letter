<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Special Love Letter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="envelope-wrapper">
        <div class="envelope">
            <div class="flap"></div>
            <div class="card">
                <div class="letter-content">
                    <p>My Dearest,</p>
                    <p>3 saal pehle dil ne tumhe chuna tha,aur aaj bhi wahi faisla sabse sahi lagta hai.
Tum meri hasi ho, meri himmat ho, meri home ho.
Iss Propose Day pe ek hi sawaal hai—
kya tum meri har kal ki kahani banogi? 💍✨   </p>
                
                    <p>Hamesha tumhara,</p>
                    <p class="signature">DHIRAJ</p>
                </div>
            </div>
            <div class="envelope-back"></div>
        </div>
        <button class="open-button">Open My Heart 💌</button>
    </div>

    <audio id="background-music" loop>
        <source src="your-romantic-song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script src="script.js"></script>
</body>
</html>
